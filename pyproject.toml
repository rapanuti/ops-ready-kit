[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-ready-kit"
version = "0.1.0"
description = "Generate operational documentation and deployment readiness artifacts from a software repository."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ops-ready-kit contributors" }]
keywords = ["devops", "sre", "runbook", "operations", "deployment", "kubernetes", "docker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
ops-ready-kit = "ops_ready_kit.cli:app"

[project.urls]
Homepage = "https://github.com/rapanuti/ops-ready-kit"
Issues = "https://github.com/rapanuti/ops-ready-kit/issues"
Repository = "https://github.com/rapanuti/ops-ready-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_ready_kit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
